# 工作流名称（会显示在 GitHub Actions 页面上）
name: API Tests

# 什么时候触发这个工作流
on:
  push:                        # 推送到 main 分支时触发
    branches: [main]
  pull_request:                # 有人向 main 提 PR 时也触发
    branches: [main]

# 要执行的任务
jobs:
  test:
    # 用 GitHub 提供的哪台云端机器（免费）
    runs-on: ubuntu-latest

    # 一连串步骤，从上到下执行，任一步失败就中止
    steps:
      # ① 把仓库代码拉到这台机器上
      - name: 检出代码
        uses: actions/checkout@v7

      # ② 装 Python
      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      # ③ 装依赖（就是你本地跑过的那一步）
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ④ 跑测试
      - name: 运行测试
        run: pytest